name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    # 평소 2분 이내
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 버전은 .nvmrc 에서 읽는다
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # packageManager(npm@11.19.0)를 적용한다. npm 버전이 다르면 lockfile 이 어긋나 npm ci 가 실패한다.
      - name: Enable Corepack
        run: corepack enable npm

      - name: Install
        run: npm ci

      # next typegen 이 LayoutProps 같은 전역 타입을 만든다
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 커버리지 포함. 바닥선 아래면 실패한다.
      - name: Test
        run: npm run test:coverage

      # 커버리지가 낮은 파일을 실행 요약에 표시
      - name: Coverage Summary
        if: always()
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const data = JSON.parse(readFileSync("coverage/coverage-summary.json", "utf8"));
            const { lines, branches, statements, functions } = data.total;
            const out = [
              "### Coverage",
              `Lines **${lines.pct}%** · Branches **${branches.pct}%** · Statements **${statements.pct}%** · Functions **${functions.pct}%**`,
            ];
            const weakest = Object.entries(data)
              .filter(([file]) => file !== "total")
              .map(([file, value]) => [file.split("kotona-web/").pop(), value.statements.pct])
              .filter(([, pct]) => pct < 95)
              .sort((a, b) => a[1] - b[1])
              .slice(0, 5);
            if (weakest.length) {
              out.push("", "| Least covered | % Statements |", "|---|---|");
              for (const [file, pct] of weakest) out.push(`| \`${file}\` | ${pct}% |`);
            }
            console.log(out.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      # 데모 모드라 백엔드·DB·API 키 없이 돈다. 브라우저는 캐시하지 않는다.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      # 빌드는 백엔드를 호출하지 않아 KOTONA_API_URL 없이 통과한다.
      - name: Build
        run: npm run build

# api.d.ts 가 현재 백엔드 스펙과 맞는지는 확인하지 않는다(Spring Boot, MySQL 이 필요해서, #2).
