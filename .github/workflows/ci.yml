name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 버전은 .nvmrc 한 곳에서 읽는다. 로컬(nvm/fnm)과 CI 가 같은 파일을 보므로 어긋날 수 없다.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # package.json 의 packageManager(npm@11.19.0)를 실제로 적용한다.
      # 이게 없으면 각자 설치된 npm 이 쓰이고, 버전이 다르면 lockfile 이 어긋나
      # npm ci 가 깨진다 — 이번 주에만 두 번 겪었다(49d3cd0, 782fe63).
      - name: Enable Corepack
        run: corepack enable npm

      # lockfile 을 커밋해 두었으니 그대로 설치한다. npm install 은 lockfile 을 고칠 수 있다.
      - name: Install
        run: npm ci

      # next typegen 이 LayoutProps·RouteContext 같은 전역 타입을 만든다. 없으면 tsc 가 실패한다.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # 예시 데이터는 백엔드 없이 배포된 사이트가 보여 주는 전부라, 여기가 깨지면
      # 화면이 바로 깨진다. 순수 함수라 DB 도 브라우저도 필요 없다.
      - name: Test
        run: npm test

      # 브라우저로 사이트 전체를 돌린다. 데모 모드라 백엔드·DB·API 키가 없어도 되고,
      # 호출당 비용도 없다 — 보통 E2E 를 CI 에서 빼는 이유가 여기서는 성립하지 않는다.
      # 브라우저는 캐시하지 않는다. 설치가 수십 초라 캐시 관리보다 싸다.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - name: Keep the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      # React Compiler 와 route handler 설정(maxDuration 등)은 빌드에서만 검증된다.
      # 빌드는 백엔드를 부르지 않으므로 KOTONA_API_URL 없이 통과한다.
      - name: Build
        run: npm run build

# api.d.ts 가 백엔드 스펙과 맞는지는 여기서 확인하지 않는다.
# 그러려면 이 워크플로 안에 Spring Boot 와 MySQL 을 띄워야 해서, 린트·빌드 파이프라인의 범위를 넘는다(#2).
