# 주 1회 의존성 업데이트. 마이너·패치는 한 PR 로 묶고, 메이저는 따로 받는다.
# 보안 업데이트는 별도로 바로 열린다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 생태계 쪽 문제로 막혀 있는 메이저 버전.
      # TypeScript 7: typescript-eslint 가 아직 지원하지 않는다(typescript-eslint#10940).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # ESLint 10: eslint-plugin-react 가 제거된 context.getFilename() 을 쓴다.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
